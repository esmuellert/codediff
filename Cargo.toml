[workspace]
resolver = "3"
# Crates are created when the milestone that needs them arrives, not up front.
# The intended set and its dependency graph are in docs/plan/02-architecture.md;
# `cargo xtask lint-arch` enforces the forbidden edges as each crate appears.
members = [
    "crates/vscode-diff-sys",
    "crates/diff-types",
    "crates/file-types",
    "crates/vscode-diff",
    "crates/line-index",
    "crates/align",
    "crates/vcs",
    "crates/fixtures",
    "crates/syntax",
    "crates/ui",
    "crates/codediff",
    "xtask",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/esmuellert/codediff"
authors = ["Yanuo Ma"]

# Every crate opts in with `[lints] workspace = true`.
# The two FFI crates declare their own weaker policy; see crates/vscode-diff-sys
# and crates/vscode-diff. Nothing else in the workspace may contain `unsafe`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
vscode-diff-sys = { path = "crates/vscode-diff-sys" }
diff-types = { path = "crates/diff-types" }
file-types = { path = "crates/file-types" }
vscode-diff = { path = "crates/vscode-diff" }
line-index = { path = "crates/line-index" }
align = { path = "crates/align" }
vcs = { path = "crates/vcs" }
fixtures = { path = "crates/fixtures" }
syntax = { path = "crates/syntax" }
ui = { path = "crates/ui" }

# The TextMate engine, and bat's extended grammar set. `onig` rather than
# `fancy-regex`: it is the same Oniguruma VS Code compiles to WASM, four times
# faster in our measurement, and the only backend that carries every grammar.
# See crates/syntax/README.md and D36.
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }

# The parsing engine, for the languages that have one. A grammar knows that
# `Rect` in `area: Rect` is a type, which a regex over lines cannot; measured
# on our own source it colours 92% of identifiers where TextMate reaches 81%,
# and it does so ten times faster. It does not replace `syntect`: there are
# ~40 maintained grammars against two-face's 183 languages, so the TextMate
# engine remains the fallback for everything else. See D39.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"

# One crate per language. Each ships its own `highlights.scm`, which is why
# this is a dependency list rather than a body of work. Version numbers  wildly
# because every grammar is versioned by its own repository; they agree on the
# `tree-sitter-language` ABI shim rather than on the core crate.
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
# Key *vocabulary* only: compile-time key literals for the binding table, and
# formatting for a help screen. Sequences, contexts and dispatch are ours —
# a crokey "combination" is keys pressed together, not one after another.
crokey = { version = "1.5", default-features = false }
# Only for suspending: raw mode disables the terminal's own Ctrl-Z handling, so
# the signal has to be raised by hand. Safe API; no `unsafe` in our crates.
signal-hook = { version = "0.3", default-features = false }
# Test-only: allocates a real terminal so the alternate screen and raw mode can
# be checked from outside the process that set them.
portable-pty = { version = "0.9", default-features = false }

[profile.release]
lto = "thin"
# Symbols, not just debug info. Twenty-five parsers are generated C with a
# symbol per state table, which is 39 MB of names nobody reads: `strip =
# "debuginfo"` left a 42 MB binary whose actual code and data is 2.9 MB. A
# panic still reports its file and line, which is what a bug report needs.
strip = "symbols"
