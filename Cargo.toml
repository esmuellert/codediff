[workspace]
resolver = "3"
# Crates are created when the milestone that needs them arrives, not up front.
# The intended set and its dependency graph are in docs/plan/02-architecture.md;
# `cargo xtask lint-arch` enforces the forbidden edges as each crate appears.
members = [
    "crates/vscode-diff-sys",
    "crates/diff-types",
    "crates/file-types",
    "crates/vscode-diff",
    "crates/line-index",
    "crates/align",
    "crates/vcs",
    "crates/fixtures",
    "crates/syntax",
    "crates/ui",
    "crates/codediff",
    "xtask",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/esmuellert/codediff"
authors = ["Yanuo Ma"]

# Every crate opts in with `[lints] workspace = true`.
# The two FFI crates declare their own weaker policy; see crates/vscode-diff-sys
# and crates/vscode-diff. Nothing else in the workspace may contain `unsafe`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
vscode-diff-sys = { path = "crates/vscode-diff-sys" }
diff-types = { path = "crates/diff-types" }
file-types = { path = "crates/file-types" }
vscode-diff = { path = "crates/vscode-diff" }
line-index = { path = "crates/line-index" }
align = { path = "crates/align" }
vcs = { path = "crates/vcs" }
fixtures = { path = "crates/fixtures" }
syntax = { path = "crates/syntax" }
ui = { path = "crates/ui" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
# Key *vocabulary* only: compile-time key literals for the binding table, and
# formatting for a help screen. Sequences, contexts and dispatch are ours —
# a crokey "combination" is keys pressed together, not one after another.
crokey = { version = "1.5", default-features = false }
# Only for suspending: raw mode disables the terminal's own Ctrl-Z handling, so
# the signal has to be raised by hand. Safe API; no `unsafe` in our crates.
signal-hook = { version = "0.3", default-features = false }
# Test-only: allocates a real terminal so the alternate screen and raw mode can
# be checked from outside the process that set them.
portable-pty = { version = "0.9", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"
