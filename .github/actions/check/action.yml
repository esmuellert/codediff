name: Check
description: All validation steps for one platform cell.

runs:
  using: composite
  steps:
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Format
      shell: bash
      run: cargo fmt --all --check

    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Test
      shell: bash
      run: cargo test --workspace

    - name: Verify vendored C
      shell: bash
      run: cargo xtask verify-c

    - name: Lint file sizes
      shell: bash
      run: cargo xtask lint-size

    - name: Lint architecture
      shell: bash
      run: cargo xtask lint-arch

    - name: Oracle parity
      shell: bash
      run: cargo xtask verify-oracle
