name: Check
description: All validation steps for one platform cell.

runs:
  using: composite
  steps:
    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Fix link.exe PATH conflict
      if: runner.os == 'Windows'
      shell: bash
      run: rm -f "/c/Program Files/Git/usr/bin/link.exe"

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Format
      shell: bash
      run: cargo fmt --all --check

    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Test
      shell: bash
      run: cargo test --workspace

    - name: Test C engine
      shell: bash
      run: |
        cmake -S libvscode-diff -B target/libvscode-diff-cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_OPENMP=OFF
        cmake --build target/libvscode-diff-cmake --config Release --parallel
        ctest --test-dir target/libvscode-diff-cmake -C Release --output-on-failure

    - name: Lint file sizes
      shell: bash
      run: cargo xtask lint-size

    - name: Lint architecture
      shell: bash
      run: cargo xtask lint-arch

    - name: Oracle parity
      shell: bash
      run: cargo xtask verify-oracle
