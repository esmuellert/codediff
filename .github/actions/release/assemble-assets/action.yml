name: Assemble release assets
description: Verify release archives and create their checksum manifest.

inputs:
  version:
    description: Release version without the v prefix.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: release-*-*
        merge-multiple: true

    - name: Verify archives
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        for platform in linux-x64 linux-arm64 macos-arm64 macos-x64; do
          test -f "dist/codediff-$VERSION-$platform.tar.gz"
          test -f "dist/codediff-watcher-$VERSION-$platform.tar.gz"
        done
        for platform in windows-x64 windows-arm64; do
          test -f "dist/codediff-$VERSION-$platform.zip"
          test -f "dist/codediff-watcher-$VERSION-$platform.zip"
        done
        test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12

    - name: Checksums
      shell: bash
      run: cd dist && sha256sum -- * > SHA256SUMS

    - name: Upload release assets
      uses: actions/upload-artifact@v7
      with:
        name: release-assets
        path: dist/*
        if-no-files-found: error
        overwrite: true
