name: Build Linux release
description: Build and archive both release binaries on CentOS 7.

inputs:
  version:
    description: Release version without the v prefix.
    required: true
  platform:
    description: Platform suffix used in archive names.
    required: true
  arch:
    description: Release architecture.
    required: true
  docker_platform:
    description: Docker platform used for the CentOS container.
    required: true

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-edit

    - name: Apply version locally
      shell: bash
      run: |
        cargo set-version "${{ inputs.version }}"
        cargo update -w

    - name: Build in CentOS 7
      shell: bash
      env:
        RELEASE_ARCH: ${{ inputs.arch }}
        RELEASE_VERSION: ${{ inputs.version }}
        DOCKER_PLATFORM: ${{ inputs.docker_platform }}
      run: |
        toolchain=$(grep -m1 '^channel' rust-toolchain.toml | cut -d '"' -f 2)
        docker run --rm --interactive \
          --platform "$DOCKER_PLATFORM" \
          -v "$GITHUB_WORKSPACE:/workspace" \
          -w /workspace \
          -e "HOST_UID=$(id -u)" \
          -e "HOST_GID=$(id -g)" \
          -e "RELEASE_ARCH=$RELEASE_ARCH" \
          -e "RELEASE_VERSION=$RELEASE_VERSION" \
          -e "RUST_TOOLCHAIN_VERSION=$toolchain" \
          centos:7 \
          bash -s <<'CONTAINER'
        set -euo pipefail

        retry_yum() {
            local attempt
            for attempt in 1 2 3 4 5; do
                if yum install -y --setopt=retries=10 --setopt=timeout=60 "$@"; then
                    return 0
                fi
                echo "yum attempt $attempt failed; retrying" >&2
                sleep $((attempt * 5))
                yum clean metadata
            done
            return 1
        }

        sed -i \
            -e 's/^mirrorlist/#mirrorlist/' \
            -e 's/^#baseurl/baseurl/' \
            -e 's/mirror.centos.org/vault.centos.org/' \
            /etc/yum.repos.d/*.repo
        yum clean all
        retry_yum curl ca-certificates make
        update-ca-trust

        if [[ "$RELEASE_ARCH" == arm64 ]]; then
            [[ $(uname -m) == aarch64 ]]
            retry_yum gcc gcc-c++
        else
            [[ $(uname -m) == x86_64 ]]
            retry_yum epel-release centos-release-scl
            rm -f /etc/yum.repos.d/CentOS-SCLo-scl.repo
            sed -i \
                -e 's/^mirrorlist/#mirrorlist/' \
                -e 's/^#baseurl/baseurl/' \
                -e 's/mirror\.centos\.org/vault.centos.org/' \
                /etc/yum.repos.d/CentOS-SCLo-scl-rh.repo
            retry_yum devtoolset-11-gcc devtoolset-11-gcc-c++
            source /opt/rh/devtoolset-11/enable
        fi

        curl --retry 5 --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
        source /root/.cargo/env

        # GCC 4.8 defaults to gnu89. The diff engine and generated
        # Tree-sitter parsers require C11 syntax.
        export CFLAGS=-std=gnu11
        export CARGO_INCREMENTAL=0
        export CARGO_TARGET_DIR=/tmp/codediff-target

        cargo build --locked --release -p codediff -p watcher --bins -j 5

        test "$("$CARGO_TARGET_DIR/release/codediff" --version)" = \
            "codediff $RELEASE_VERSION"
        test "$("$CARGO_TARGET_DIR/release/codediff-watcher" --version)" = \
            "codediff-watcher $RELEASE_VERSION"

        for binary in codediff codediff-watcher; do
            if readelf -d "$CARGO_TARGET_DIR/release/$binary" | grep -q libgomp; then
                echo "$binary unexpectedly depends on libgomp" >&2
                exit 1
            fi
        done

        output=/workspace/target/release-binaries
        rm -rf "$output"
        mkdir -p "$output"
        cp "$CARGO_TARGET_DIR/release/codediff" "$output/"
        cp "$CARGO_TARGET_DIR/release/codediff-watcher" "$output/"
        chown -R "$HOST_UID:$HOST_GID" /workspace/target
        CONTAINER

    - name: Verify versions
      shell: bash
      run: |
        codediff_version="$(target/release-binaries/codediff --version)"
        watcher_version="$(target/release-binaries/codediff-watcher --version)"
        echo "$codediff_version"
        echo "$watcher_version"
        test "$codediff_version" = "codediff ${{ inputs.version }}"
        test "$watcher_version" = "codediff-watcher ${{ inputs.version }}"

    - name: Archive binaries
      shell: bash
      run: |
        mkdir -p dist
        tar -czf "dist/codediff-${{ inputs.version }}-${{ inputs.platform }}.tar.gz" \
          -C target/release-binaries codediff
        tar -czf "dist/codediff-watcher-${{ inputs.version }}-${{ inputs.platform }}.tar.gz" \
          -C target/release-binaries codediff-watcher

    - name: Upload release archives
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.platform }}
        path: dist/*
        if-no-files-found: error
        overwrite: true
