name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     runner: ubuntu-24.04     }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm }
          - { name: windows-x64,   runner: windows-2025     }
          - { name: windows-arm64, runner: windows-11-arm   }
          - { name: macos-arm64,   runner: macos-15         }
          - { name: macos-x64,     runner: macos-15-intel   }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check
