name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  version:
    name: Version
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: release
        uses: ./.github/actions/release/version

  linux:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   runner: ubuntu-24.04,     arch: x64,   docker_platform: linux/amd64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64, docker_platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release/linux
        with:
          version: ${{ needs.version.outputs.version }}
          platform: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          docker_platform: ${{ matrix.docker_platform }}

  native:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   runner: windows-2025   }
          - { name: windows-arm64, runner: windows-11-arm }
          - { name: macos-arm64,   runner: macos-15       }
          - { name: macos-x64,     runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release/native
        with:
          version: ${{ needs.version.outputs.version }}
          platform: ${{ matrix.name }}

  assemble:
    name: Assemble release assets
    needs: [version, linux, native]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release/assemble-assets
        with:
          version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, assemble]
    if: github.event_name == 'push' && needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release/publish
        with:
          version: ${{ needs.version.outputs.version }}
          tag: ${{ needs.version.outputs.tag }}
          source_sha: ${{ github.sha }}
          app_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
