name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     runner: ubuntu-24.04     }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm }
          - { name: windows-x64,   runner: windows-2025     }
          - { name: windows-arm64, runner: windows-11-arm   }
          - { name: macos-arm64,   runner: macos-15         }
          - { name: macos-x64,     runner: macos-15-intel   }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check

  version:
    name: Version
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Decide next version
        id: bump
        run: |
          set -euo pipefail

          echo "::group::Debug info"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Tags visible:"
          git tag -l 'v0.*' | sort -V | tail -5
          echo "Latest tag: $(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo NONE)"
          echo "Commits since v0.14.0 (first-parent):"
          git log --oneline --first-parent v0.14.0..HEAD | head -10
          echo "git-cliff version: $(git-cliff --version)"
          echo "::endgroup::"

          echo "::group::git-cliff verbose"
          NEXT_TAG=$(git-cliff --bumped-version -vv 2>&1 | tee /dev/stderr | tail -1)
          echo "::endgroup::"

          CURRENT=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "CURRENT=$CURRENT  NEXT_TAG=$NEXT_TAG"
          NEXT="${NEXT_TAG#v}"

          if [ "$NEXT" = "$CURRENT" ]; then
            echo "Nothing to release (version unchanged at $CURRENT)"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next release: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     runner: ubuntu-24.04     }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm }
          - { name: windows-x64,   runner: windows-2025     }
          - { name: windows-arm64, runner: windows-11-arm   }
          - { name: macos-arm64,   runner: macos-15         }
          - { name: macos-x64,     runner: macos-15-intel   }
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Apply version locally
        run: |
          cargo set-version "${{ needs.version.outputs.version }}"
          cargo update -w

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release -p codediff

      - name: Verify version
        if: runner.os != 'Windows'
        run: |
          got="$(./target/release/codediff --version)"
          echo "$got"
          echo "$got" | grep -q "${{ needs.version.outputs.version }}"

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/codediff-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz" \
            -C target/release codediff

      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/codediff.exe `
            -DestinationPath "dist/codediff-${{ needs.version.outputs.version }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codediff-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.generate_token.outputs.token }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff,cargo-edit

      - name: Commit and tag
        run: |
          set -euo pipefail
          cargo set-version "${{ needs.version.outputs.version }}"
          cargo update -w

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: ${{ needs.version.outputs.tag }} [skip ci]"
          git tag "${{ needs.version.outputs.tag }}"
          git push origin main --tags

      - name: Generate release notes
        run: git-cliff --unreleased --strip header -o RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: codediff-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
