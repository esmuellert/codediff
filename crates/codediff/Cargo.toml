[package]
name = "codediff"
description = "A standalone, read-only terminal diff reviewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Workspace-internal: these short names are taken on crates.io.
publish = false

[[bin]]
name = "codediff"
path = "src/main.rs"

# The composition root: the only place that names concrete implementations.
[dependencies]
anyhow.workspace = true
clap.workspace = true
line-index.workspace = true
align.workspace = true
vcs.workspace = true
vscode-diff.workspace = true

[dev-dependencies]
fixtures.workspace = true

[lints]
workspace = true
